name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Validate stage packs
        run: npm run validate:content
      - name: Headless simulation of the test stage
        run: npm run simulate -- test-stage 1

  balance:
    name: AI balance (200 matches per difficulty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # All nine matchups on Lion (M8), four at a time; each fails on a crash, a refused AI command or a side above 70%.
      - name: Balance of every matchup
        run: |
          for a in explorer hunter photographer; do for d in ranger wildlife-protector field-researcher; do echo "$a $d"; done; done |
            xargs -P 4 -L 1 sh -c 'npm run -s balance -- 200 stage-01-big-five lion --attacker=$0 --defender=$1 --check > "balance-$0-$1.log" 2>&1; status=$?; cat "balance-$0-$1.log"; exit $status'

  browser:
    name: Browser tests (desktop, tablet, phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/e2e
            playwright-report
          retention-days: 14
